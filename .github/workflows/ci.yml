name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  no-plaintext-env:
    name: Guard against committed .env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fail if .env is tracked
        run: |
          if git ls-files | grep -qx '.env'; then
            echo "::error::.env is tracked by git. Only .env.sops and .env.example may be committed."
            exit 1
          fi
          echo ".env is not tracked. OK."

  yaml-lint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: Lint workflow files
        run: yamllint .github/workflows
