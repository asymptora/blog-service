extends: default

rules:
  # GitHub Actions uses "on:" as a top-level key, which yamllint's default
  # ruleset reads as a truthy value. Limit the truthy check to actual
  # values, not map keys.
  truthy:
    check-keys: false

  # GitHub Actions workflow files routinely have long run commands and
  # download URLs. 80 columns is unrealistic for this content; widen it
  # instead of wrapping every long line by hand.
  line-length:
    max: 120

  # GitHub Actions workflow files never start with "---" by convention.
  # Not enforcing it here matches every real workflow file, not just ours.
  document-start: disable
